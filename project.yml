name: OfflineFeed
options:
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
targets:
  OfflineFeed:
    type: application
    platform: iOS
    sources: [Feed]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.offline.feed
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Лента
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: '1.2'
        CURRENT_PROJECT_VERSION: '3'
  FeedTests:
    type: bundle.unit-test
    platform: iOS
    sources: [FeedTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.offline.feed.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: OfflineFeed
schemes:
  OfflineFeed:
    build:
      targets:
        OfflineFeed: all
        FeedTests: [test]
    test:
      targets: [FeedTests]
